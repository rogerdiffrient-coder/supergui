name: Build SuperGUI v5.1 overhaul

on:
  push:
    branches:
      - feature/supergui-v5x-overhaul

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v5x-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supergui-v5x-overhaul
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: npm run build
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/supergui.js
          git commit -m "build: regenerate SuperGUI v5.1 bundle [v5x-build]"
          git pull --rebase origin feature/supergui-v5x-overhaul
          git push origin feature/supergui-v5x-overhaul
