name: Build editor auto-open

on:
  push:
    branches:
      - fix/editor-auto-open-and-minimize-icon

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[editor-auto-open-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-auto-open-and-minimize-icon
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/auto-open-editor.py
      - name: Build
        run: npm run build
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/super-gui.js src/editor/editor-template.js dist/supergui.js
          git commit -m "feat: auto-open embedded editor and simplify minimize icon [editor-auto-open-build]"
          git pull --rebase origin fix/editor-auto-open-and-minimize-icon
          git push origin fix/editor-auto-open-and-minimize-icon
