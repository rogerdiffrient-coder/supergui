name: Test runtime stability pass

on:
  push:
    branches:
      - fix/runtime-stability-pass

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-stability-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-stability-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: npm run build
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/supergui.js
          git commit -m "build: regenerate SuperGUI 5.2 bundle [runtime-stability-build]" || exit 0
          git pull --rebase origin fix/runtime-stability-pass
          git push origin fix/runtime-stability-pass
