name: Build SuperGUI v6

on:
  push:
    branches:
      - feature/supergui-v6

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v6-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supergui-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply v6 wiring
        run: python3 scripts/apply-v6.py
      - name: Build
        run: npm run build
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit generated v6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: generate SuperGUI v6 [v6-build]"
          git pull --rebase origin feature/supergui-v6
          git push origin feature/supergui-v6
