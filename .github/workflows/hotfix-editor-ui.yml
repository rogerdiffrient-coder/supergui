name: Hotfix SuperGUI editor UI

on:
  push:
    branches:
      - hotfix/editor-ui-5.1.1

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[editor-ui-hotfix-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/editor-ui-5.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply hotfix
        run: python3 scripts/hotfix-editor-ui.py
      - name: Build
        run: npm run build
      - name: Test
        run: |
          npm test
          npm run check
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: SuperGUI 5.1.1 editor UI hotfix [editor-ui-hotfix-build]"
          git pull --rebase origin hotfix/editor-ui-5.1.1
          git push origin hotfix/editor-ui-5.1.1
