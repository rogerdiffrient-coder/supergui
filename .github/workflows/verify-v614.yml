name: Verify SuperGUI 6.1.4
on:
  push:
    branches: [fix/v614-single-registration]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v614-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v614-single-registration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/supergui.js
          git commit -m "build: generate SuperGUI 6.1.4 [v614-build]" || exit 0
          git pull --rebase origin fix/v614-single-registration
          git push origin fix/v614-single-registration
