name: Build SuperGUI v5

on:
  push:
    branches:
      - feature/supergui-v5-layout-editor

permissions:
  contents: write

jobs:
  build-v5:
    if: ${{ !contains(github.event.head_commit.message, '[v5-build-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supergui-v5-layout-editor

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply v5 source upgrade
        run: python3 scripts/apply-v5-upgrade.py

      - name: Build bundle
        run: npm run build

      - name: Run tests and checks
        run: |
          npm test
          npm run check

      - name: Commit generated v5 upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constants-and-model.js src/editor/editor-template.js src/v5-layout.js scripts/build.mjs package.json dist/supergui.js
          git commit -m "feat: build SuperGUI v5 layout editor [v5-build-bot]"
          git pull --rebase origin feature/supergui-v5-layout-editor
          git push origin feature/supergui-v5-layout-editor
