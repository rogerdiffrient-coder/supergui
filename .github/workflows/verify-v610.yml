name: Verify SuperGUI 6.1.0
on:
  push:
    branches: [feat/v610-chat-compat]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v610-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v610-chat-compat
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/supergui.js
          git commit -m "build: generate SuperGUI 6.1.0 [v610-build]" || exit 0
          git pull --rebase origin feat/v610-chat-compat
          git push origin feat/v610-chat-compat
