name: Final SuperGUI v6 verification

on:
  push:
    branches:
      - feature/supergui-v6

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v6-final-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supergui-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: |
          npm test
          npm run check
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/supergui.js
          git commit -m "build: final SuperGUI v6 bundle [v6-final-build]" || exit 0
          git pull --rebase origin feature/supergui-v6
          git push origin feature/supergui-v6
