name: Fix SuperGUI rotation

on:
  push:
    branches:
      - fix/rotation-and-regressions

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[rotation-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rotation-and-regressions

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch rotation editor code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/editor/editor-template.js')
          s = p.read_text()

          old = """            var rh=document.createElement('div'); rh.className='rothandle'; rh.addEventListener('mousedown', function(e){e.stopPropagation(); selectedPanel=key; selectedElement=id; renderAll(); startRotate(e, panel, el, wrap);}); wrap.appendChild(rh);"""
          new = """            var rh=document.createElement('div'); rh.className='rothandle'; rh.addEventListener('mousedown', function(e){
              e.stopPropagation();
              selectedPanel=key;
              selectedElement=id;
              startRotate(e, panel, el, wrap);
            }); wrap.appendChild(rh);"""
          if old not in s:
              raise SystemExit('rotation handle snippet not found')
          s = s.replace(old, new, 1)

          old2 = """  function startRotate(e, p, el, wrapNode) { var r=wrapNode.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; function a(ev){ return Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI+90; } function m(ev){ el.rotation=Math.round(a(ev)); renderStage(); } function u(){ document.removeEventListener('mousemove',m); document.removeEventListener('mouseup',u); renderProps(); } document.addEventListener('mousemove',m); document.addEventListener('mouseup',u); }"""
          new2 = """  function startRotate(e, p, el, wrapNode) {
            e.preventDefault();
            var r=wrapNode.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
            function angle(ev){ return Math.atan2(ev.clientY-cy, ev.clientX-cx)*180/Math.PI+90; }
            function m(ev){
              el.rotation=Math.round(angle(ev));
              wrapNode.style.transform='rotate('+el.rotation+'deg)';
            }
            function u(){
              document.removeEventListener('mousemove',m);
              document.removeEventListener('mouseup',u);
              renderAll();
            }
            m(e);
            document.addEventListener('mousemove',m);
            document.addEventListener('mouseup',u);
          }"""
          if old2 not in s:
              raise SystemExit('startRotate snippet not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY

      - name: Test and build
        run: |
          npm test
          npm run check
          npm run build

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/editor-template.js dist/supergui.js
          git commit -m "fix: make editor rotation responsive [rotation-fix-bot]"
          git push origin fix/rotation-and-regressions
