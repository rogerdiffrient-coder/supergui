name: Build embedded SuperGUI editor

on:
  push:
    branches:
      - feature/embedded-editor-dock

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[embedded-editor-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/embedded-editor-dock

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply embedded editor patch
        run: python3 scripts/embed-editor-dock.py

      - name: Build
        run: npm run build

      - name: Test
        run: |
          npm test
          npm run check

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/super-gui.js src/editor/editor-template.js dist/supergui.js
          git commit -m "feat: embed SuperGUI editor in PenguinMod [embedded-editor-build]"
          git pull --rebase origin feature/embedded-editor-dock
          git push origin feature/embedded-editor-dock
