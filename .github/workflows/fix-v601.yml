name: Verify SuperGUI 6.0.1 hotfix
on:
  push:
    branches: [fix/v6-editor-live-preview]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v601-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v6-editor-live-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/patch-editor-601.py
      - run: python3 scripts/patch-v6-categories-blocks.py
      - run: npm run build
      - run: |
          npm test
          npm run check
      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json scripts/build.mjs dist/supergui.js
          git commit -m "build: generate SuperGUI 6.0.1 hotfix [v601-build]"
          git pull --rebase origin fix/v6-editor-live-preview
          git push origin fix/v6-editor-live-preview
